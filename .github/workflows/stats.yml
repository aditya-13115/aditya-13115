name: Update GitHub README Stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      # ─────────────────────────────────────────────
      # GitHub Stats
      # ─────────────────────────────────────────────

      - name: Generate dark stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=0D1117&title_color=E7E5E4&text_color=A8A29E&icon_color=D6B77A&ring_color=D6B77A&cache_seconds=86400
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate light stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=FFFFFF&title_color=292524&text_color=57534E&icon_color=9A7B3F&ring_color=9A7B3F&cache_seconds=86400
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ─────────────────────────────────────────────
      # Top Languages
      # ─────────────────────────────────────────────

      - name: Generate dark top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&bg_color=0D1117&title_color=E7E5E4&text_color=A8A29E&icon_color=D6B77A&cache_seconds=86400
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate light top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&bg_color=FFFFFF&title_color=292524&text_color=57534E&icon_color=9A7B3F&cache_seconds=86400
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ─────────────────────────────────────────────
      # GitHub Streak
      # ─────────────────────────────────────────────

      - name: Generate dark streak card
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=0D1117&ring=D6B77A&fire=CBA96B&currStreakLabel=E7E5E4&currStreakNum=E7E5E4&sideLabels=A8A29E&sideNums=D6D3D1&dates=78716C&stroke=44403C&disable_animations=true
          path: profile/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light streak card
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=FFFFFF&ring=9A7B3F&fire=A16207&currStreakLabel=292524&currStreakNum=292524&sideLabels=57534E&sideNums=44403C&dates=78716C&stroke=D6D3D1&disable_animations=true
          path: profile/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────
      # Commit generated cards
      # ─────────────────────────────────────────────

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No stats changes to commit."
            exit 0
          fi

          git commit -m "chore: update github stats"
          git push